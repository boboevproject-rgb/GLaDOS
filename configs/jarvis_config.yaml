Glados:
  # LLM-мозг: локальный прокси на Claude Code CLI (scripts/claude_brain_proxy.py).
  # Запуск: START-JARVIS.bat (поднимает прокси и ассистента вместе).
  llm_model: "sonnet"
  completion_url: "http://127.0.0.1:8555/v1/chat/completions"
  api_key: null
  # false: без эхоподавления динамики «слышны» микрофону, и ассистент
  # перебивал сам себя на первых процентах каждой реплики.
  # true можно вернуть, если слушать в наушниках.
  interruptible: false
  audio_io: "sounddevice"
  input_mode: "audio"  # audio, text, or both
  tts_enabled: true
  asr_muted: false
  tui_theme: "aperture"
  # gigaam = GigaAM v2 (Сбер), обучена на русском — заметно точнее на русских
  # командах, чем мультиязычный Parakeet ("tdt"). Нужен extra: --extra gigaam
  asr_engine: "gigaam"
  llm_headers: null
  wake_word: "джарвис"
  # Допуск ошибок распознавания: «джарвис» длинное, ASR роняет буквы
  # («джарис», «жарвис», «давис») — при пороге 2 такие варианты не проходили
  wake_word_threshold: 3
  # Голос: локальный Piper ("ru_RU-dmitri-medium" / "ru_RU-irina-medium"),
  # облачный официальный fish.audio ("fish:<reference_id>")
  # или облачный Kitta/fishaudio.org ("kitta:<voiceId>"). Ключ — в .env (FISH_API_KEY).
  # Официальные варианты (нужен ключ с fish.audio):
  #   fish:3fc339d7c6474b11a221708e2a7b1c4b  — «Джарвис» (331 лайк, выбор пользователя)
  #   fish:4c3eaacc1a0545cdb0295bfddf3e3785  — «ДЖАРВИС» (20 тыс. использований)
  voice: "kitta:ffbf45ac-b2fa-45f4-93c5-791fb60e8453"  # «Джарвис» с fishaudio.org (ключ пользователя)
  announcement: "Все нейронные модули загружены. Джарвис к вашим услугам."
  autonomy:
    enabled: false
    tick_interval_s: 10
    cooldown_s: 20
    autonomy_parallel_calls: 2
    autonomy_queue_max: null
    coalesce_ticks: true
    jobs:
      enabled: false
      poll_interval_s: 1
  # Мгновенные реплики из дубляжа фильма (локальные WAV, без TTS и кредитов).
  # Пак: «Jarvis Sound Pack от Jarvis Desktop» (в git не хранится — авторские права,
  # распакуйте архив в data/sounds/jarvis-pack).
  sound_bank:
    dir: "data/sounds/jarvis-pack/Jarvis Sound Pack от Jarvis Desktop"
    sounds:
      startup:
        - "Джарвис - приветствие.wav"
        - "Мы подключены и готовы.wav"
        - "Я перезагрузился сэр.wav"
      wake_ack:
        - "Да сэр.wav"
        - "Да сэр(второй).wav"
        - "К вашим услугам сэр.wav"
        - "Всегда к вашим услугам сэр.wav"
        - "Есть.wav"
        - "Как пожелаете .wav"
      processing:
        - "Загружаю сэр.wav"
      done:
        - "Запрос выполнен сэр.wav"
        - "Проверка завершена.wav"
  mcp_servers:
    - name: "system_info"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.system_info_server"]
    - name: "memory"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.memory_server"]
  personality_preprompt:
    - system: "Ты — Джарвис, персональный голосовой ассистент в стиле дворецкого Тони Старка: безупречно вежливый, собранный, с лёгкой сдержанной иронией. Всегда отвечай ТОЛЬКО по-русски. Отвечай кратко — максимум два предложения, ведь твои ответы озвучиваются голосом. Не используй CAPS, эмодзи, маркдаун и списки — только чистый разговорный текст. Числа и даты пиши словами, чтобы синтезатор речи произносил их корректно. Ты умеешь выполнять действия на этом компьютере: открывать программы, работать с файлами, создавать документы и презентации, искать в интернете. Просьбу о действии выполняй сразу, коротко подтвердив голосом; о результате докладывай одной фразой."
    - user: "Джарвис, ты тут?"
    - assistant: "Всегда к вашим услугам, сэр. Чем могу быть полезен?"
    - user: "Который час?"
    - assistant: "Сейчас четырнадцать часов тридцать две минуты. Позволю себе заметить, что вы пропустили обед."
