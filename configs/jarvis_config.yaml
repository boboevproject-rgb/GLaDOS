Glados:
  # LLM-мозг: локальная Ollama по умолчанию; можно указать любой OpenAI-совместимый API
  llm_model: "llama3.2"
  completion_url: "http://localhost:11434/api/chat"
  api_key: null
  interruptible: true
  audio_io: "sounddevice"
  input_mode: "audio"  # audio, text, or both
  tts_enabled: true
  asr_muted: false
  tui_theme: "aperture"
  asr_engine: "tdt"  # tdt = Parakeet v3, мультиязычный (русский поддержан); ctc — только английский!
  llm_headers: null
  wake_word: "джарвис"
  # Голос: локальный Piper ("ru_RU-dmitri-medium" / "ru_RU-irina-medium"),
  # облачный официальный fish.audio ("fish:<reference_id>")
  # или облачный Kitta/fishaudio.org ("kitta:<voiceId>"). Ключ — в .env (FISH_API_KEY).
  # Официальные варианты (нужен ключ с fish.audio):
  #   fish:3fc339d7c6474b11a221708e2a7b1c4b  — «Джарвис» (331 лайк, выбор пользователя)
  #   fish:4c3eaacc1a0545cdb0295bfddf3e3785  — «ДЖАРВИС» (20 тыс. использований)
  voice: "kitta:ffbf45ac-b2fa-45f4-93c5-791fb60e8453"  # «Джарвис» с fishaudio.org (ключ пользователя)
  announcement: "Все нейронные модули загружены. Джарвис к вашим услугам."
  autonomy:
    enabled: false
    tick_interval_s: 10
    cooldown_s: 20
    autonomy_parallel_calls: 2
    autonomy_queue_max: null
    coalesce_ticks: true
    jobs:
      enabled: false
      poll_interval_s: 1
  mcp_servers:
    - name: "system_info"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.system_info_server"]
    - name: "memory"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.memory_server"]
  personality_preprompt:
    - system: "Ты — Джарвис, персональный голосовой ассистент в стиле дворецкого Тони Старка: безупречно вежливый, собранный, с лёгкой сдержанной иронией. Всегда отвечай ТОЛЬКО по-русски. Отвечай кратко — максимум два предложения, ведь твои ответы озвучиваются голосом. Не используй CAPS, эмодзи, маркдаун и списки — только чистый разговорный текст. Числа и даты пиши словами, чтобы синтезатор речи произносил их корректно. Если просят выполнить действие, которое тебе недоступно, честно скажи об этом и предложи альтернативу."
    - user: "Джарвис, ты тут?"
    - assistant: "Всегда к вашим услугам, сэр. Чем могу быть полезен?"
    - user: "Который час?"
    - assistant: "Сейчас четырнадцать часов тридцать две минуты. Позволю себе заметить, что вы пропустили обед."
